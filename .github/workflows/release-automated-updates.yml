name: Publish production release

# Production is intentionally decoupled from merges to main. Reviewed PRs and
# automated data refreshes can accumulate without consuming a production deploy.
# When the site is ready to publish, run this workflow manually from main. It
# verifies the currently deployed commit when possible and then creates the one
# commit shape that Netlify's ignore policy allows to build in production.
on:
  workflow_dispatch:
    inputs:
      reason:
        description: "Optional note describing why this production release is being published"
        required: false
        type: string
      force:
        description: "Publish even if the deployed commit cannot be verified"
        required: false
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: publish-production-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Require main branch
        run: |
          set -euo pipefail
          if [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "::error::Production releases must be dispatched from main."
            exit 1
          fi

      - name: Check whether production is behind main
        id: drift
        env:
          FORCE_RELEASE: ${{ inputs.force }}
        run: |
          set -euo pipefail
          head_sha="$(git rev-parse HEAD)"
          deployed_sha=""

          if manifest="$(curl --fail --silent --show-error --max-time 15 https://accessmi.org/.well-known/build.json)"; then
            deployed_sha="$(printf '%s' "$manifest" | jq -r '.commit // empty')"
          fi

          if [ -z "$deployed_sha" ]; then
            if [ "$FORCE_RELEASE" = "true" ]; then
              echo "Production identity unavailable; continuing because force=true."
            else
              echo "::error::Could not verify the deployed commit from /.well-known/build.json. Re-run with force only after confirming production manually."
              exit 1
            fi
          elif [ "$deployed_sha" = "$head_sha" ]; then
            echo "Production already matches main ($head_sha); no deploy needed."
            echo "release_needed=false" >> "$GITHUB_OUTPUT"
            exit 0
          elif git merge-base --is-ancestor "$deployed_sha" "$head_sha"; then
            echo "Production $deployed_sha is behind main $head_sha; release is needed."
          elif [ "$FORCE_RELEASE" = "true" ]; then
            echo "Deployed commit is not an ancestor of main; continuing because force=true."
          else
            echo "::error::Deployed commit $deployed_sha is not an ancestor of main $head_sha. Resolve the drift or re-run with force after review."
            exit 1
          fi

          echo "release_needed=true" >> "$GITHUB_OUTPUT"

      # Test the exact tree that will be published. The release marker is an
      # empty commit, so its tree is identical to HEAD's. Netlify's own build
      # also runs every integrity guard, but nothing here may assume that a
      # green Netlify build means the right tree is live.
      - uses: pnpm/action-setup@v4
        if: steps.drift.outputs.release_needed != 'false'
        with:
          run_install: false
      - uses: actions/setup-node@v4
        if: steps.drift.outputs.release_needed != 'false'
        with:
          node-version: "22"
          cache: pnpm
      - name: Verify the release tree (install, typecheck, tests, full build)
        if: steps.drift.outputs.release_needed != 'false'
        run: |
          set -euo pipefail
          pnpm install --frozen-lockfile
          (cd artifacts/access-mi && pnpm typecheck && pnpm check:tests)
          node --test scripts/release.test.mjs
          pnpm run build
          node scripts/write-build-manifest.mjs
          echo "tested_tree=$(git rev-parse 'HEAD^{tree}')" >> "$GITHUB_ENV"
          # The build rewrites generated timestamps; never commit them here.
          git checkout -- .

      - name: Create production release commit
        if: steps.drift.outputs.release_needed != 'false'
        env:
          RELEASE_REASON: ${{ inputs.reason }}
        run: |
          set -euo pipefail
          timestamp="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          git config user.name "release-bot"
          git config user.email "actions@users.noreply.github.com"

          body="Requested manually through the Publish production release workflow."
          if [ -n "$RELEASE_REASON" ]; then
            body="$body Reason: $RELEASE_REASON"
          fi

          git commit --allow-empty \
            -m "chore(release): publish production $timestamp" \
            -m "$body"
          if [ "$(git rev-parse 'HEAD^{tree}')" != "$tested_tree" ]; then
            echo "::error::Release marker tree differs from the tested tree."
            exit 1
          fi
          git push origin HEAD:main
          echo "release_sha=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          echo "Created the explicit production release marker. Netlify will build this commit once."

      - name: Verify production serves the release
        # Polls /.well-known/build.json for up to 20 minutes, then checks the
        # homepage, a county page, the data exports, discovery files and the
        # 404 route. A failure here means production is NOT verified, even if
        # Netlify reports the deploy as ready.
        if: steps.drift.outputs.release_needed != 'false'
        run: node scripts/verify-release.mjs --base https://accessmi.org --expect "$release_sha" --wait 1200 --report release-verification.json

      - name: Keep the verification report
        if: always() && steps.drift.outputs.release_needed != 'false'
        uses: actions/upload-artifact@v4
        with:
          name: release-verification
          path: release-verification.json
          if-no-files-found: warn
