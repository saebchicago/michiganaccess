name: ci

on:
  # Push builds only main. Every other branch is covered by its pull request.
  #
  # This used to be `branches: ["**"]` alongside the pull_request trigger, so
  # every push to a PR branch ran the whole workflow TWICE - six concurrent
  # jobs (2x test, 2x e2e, 2x lighthouse) for one commit. On 2026-08-17 that
  # contention produced a real failure: on commit 25b0b57 one e2e run passed
  # and the other timed out after 45s inside the axe scan of /data, same SHA,
  # same minute. Halving the load removes the contention and the wasted
  # runner minutes with it.
  push:
    branches: [main]
  pull_request:
    branches: [main]

# A newer commit supersedes an in-flight run for the same PR (or for main).
# Without this, pushing twice in quick succession leaves both runs competing.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: pnpm/action-setup@v4
        with:
          version: 10
          run_install: false
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Typecheck
        working-directory: artifacts/access-mi
        run: pnpm typecheck
      - name: Unit tests
        working-directory: artifacts/access-mi
        run: pnpm check:tests
      - name: A11y gate
        working-directory: artifacts/access-mi
        run: pnpm test:a11y
      - name: Provenance gate
        working-directory: artifacts/access-mi
        run: pnpm check:provenance
      - name: Integrity guards
        # The full static guard chain. These previously ran only inside the
        # app's `build` script, which no blocking job invoked - Netlify's root
        # build calls vite directly and the only CI job running `pnpm build`
        # was the non-blocking lighthouse job. That made every guard advisory.
        # All of these are static file scans; none needs network access.
        working-directory: artifacts/access-mi
        run: |
          node scripts/check-links.mjs
          node scripts/check-routemeta-routes.mjs
          node scripts/check-counts.mjs
          node scripts/check-zip-population.mjs
          node scripts/check-county-facilities.mjs
          node scripts/check-trend-series.mjs
          node scripts/check-snap-county-dataset.mjs
          node scripts/check-fabrication.mjs
          node scripts/check-copy.mjs
          node scripts/check-no-backend-leak.mjs
          node scripts/check-data-catalog.mjs
          node scripts/check-data-freshness.mjs
          node scripts/check-data-workflows.mjs
          node scripts/check-backend-functions.mjs
          node scripts/check-dataset-labels.mjs
          node scripts/check-plausibility.mjs
          node scripts/check-script-syntax.mjs
          node scripts/check-integrity-labels.mjs
          node scripts/check-route-reachability.mjs
          node scripts/check-orphan-modules.mjs
          node scripts/check-form-labels.mjs
          node scripts/check-page-provenance.mjs
      - name: Allowlist shrink-only check
        working-directory: artifacts/access-mi
        run: |
          git fetch origin main --depth=1 --quiet 2>/dev/null || true
          ALLOWLIST="provenance-allowlist.json"
          if git show "origin/main:artifacts/access-mi/${ALLOWLIST}" > /dev/null 2>&1; then
            BASE_COUNT=$(git show "origin/main:artifacts/access-mi/${ALLOWLIST}" \
              | node -e "let d='';process.stdin.on('data',c=>d+=c).on('end',()=>{ try{ console.log(JSON.parse(d).violations?.length??0); }catch{ console.log(0); } })")
            PR_COUNT=$(node -e "const {readFileSync}=require('fs'); console.log(JSON.parse(readFileSync('${ALLOWLIST}','utf8')).violations?.length??0);")
            echo "Allowlist: base=${BASE_COUNT} this-branch=${PR_COUNT}"
            if [ "$PR_COUNT" -gt "$BASE_COUNT" ]; then
              echo "ERROR: ${ALLOWLIST} grew from ${BASE_COUNT} to ${PR_COUNT} entries."
              echo "The allowlist is shrink-only. Fix proxy patterns rather than adding allowlist entries."
              exit 1
            fi
          else
            echo "${ALLOWLIST} not yet on origin/main - skipping shrink-only check (initial introduction)"
          fi

  e2e:
    # Browser E2E: user journeys, all-routes smoke, mobile viewports, and
    # axe accessibility specs (src/test/e2e/). These specs existed but no
    # CI job ran them. Non-blocking for now (continue-on-error), matching
    # how the Lighthouse job was introduced - promote to blocking once a
    # few green runs have been observed.
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: pnpm/action-setup@v4
        with:
          version: 10
          run_install: false
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Install Playwright browsers
        working-directory: artifacts/access-mi
        run: pnpm exec playwright install --with-deps chromium
      - name: Playwright E2E
        working-directory: artifacts/access-mi
        run: pnpm test:e2e
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: artifacts/access-mi/playwright-report
          retention-days: 7

  lighthouse:
    # BLOCKING as of Round 8. Every assertion in .lighthouserc.cjs is a
    # "warn", so a low score cannot fail this job - a failure here always
    # means a Lighthouse runtime error, i.e. the production bundle genuinely
    # did not render. This is the only check that exercises the real bundle
    # in a real browser; it is what finally surfaced the TDZ crash that
    # served a blank page while 1017 unit tests stayed green.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: pnpm/action-setup@v4
        with:
          version: 10
          run_install: false
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build
        working-directory: artifacts/access-mi
        run: pnpm build
      - name: Lighthouse CI
        working-directory: artifacts/access-mi
        run: pnpm dlx @lhci/cli@0.14.x autorun
