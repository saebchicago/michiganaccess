name: ci

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: pnpm/action-setup@v4
        with:
          version: 10
          run_install: false
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Typecheck
        working-directory: artifacts/access-mi
        run: pnpm typecheck
      - name: Unit tests
        working-directory: artifacts/access-mi
        run: pnpm check:tests
      - name: A11y gate
        working-directory: artifacts/access-mi
        run: pnpm test:a11y
      - name: Provenance gate
        working-directory: artifacts/access-mi
        run: pnpm check:provenance
      - name: Integrity guards
        # The full static guard chain. These previously ran only inside the
        # app's `build` script, which no blocking job invoked - Netlify's root
        # build calls vite directly and the only CI job running `pnpm build`
        # was the non-blocking lighthouse job. That made every guard advisory.
        # All of these are static file scans; none needs network access.
        working-directory: artifacts/access-mi
        run: |
          node scripts/check-links.mjs
          node scripts/check-counts.mjs
          node scripts/check-zip-population.mjs
          node scripts/check-county-facilities.mjs
          node scripts/check-trend-series.mjs
          node scripts/check-snap-county-dataset.mjs
          node scripts/check-fabrication.mjs
          node scripts/check-copy.mjs
          node scripts/check-no-backend-leak.mjs
          node scripts/check-dataset-labels.mjs
          node scripts/check-integrity-labels.mjs
          node scripts/check-route-reachability.mjs
      - name: Allowlist shrink-only check
        working-directory: artifacts/access-mi
        run: |
          git fetch origin main --depth=1 --quiet 2>/dev/null || true
          ALLOWLIST="provenance-allowlist.json"
          if git show "origin/main:artifacts/access-mi/${ALLOWLIST}" > /dev/null 2>&1; then
            BASE_COUNT=$(git show "origin/main:artifacts/access-mi/${ALLOWLIST}" \
              | node -e "let d='';process.stdin.on('data',c=>d+=c).on('end',()=>{ try{ console.log(JSON.parse(d).violations?.length??0); }catch{ console.log(0); } })")
            PR_COUNT=$(node -e "const {readFileSync}=require('fs'); console.log(JSON.parse(readFileSync('${ALLOWLIST}','utf8')).violations?.length??0);")
            echo "Allowlist: base=${BASE_COUNT} this-branch=${PR_COUNT}"
            if [ "$PR_COUNT" -gt "$BASE_COUNT" ]; then
              echo "ERROR: ${ALLOWLIST} grew from ${BASE_COUNT} to ${PR_COUNT} entries."
              echo "The allowlist is shrink-only. Fix proxy patterns rather than adding allowlist entries."
              exit 1
            fi
          else
            echo "${ALLOWLIST} not yet on origin/main - skipping shrink-only check (initial introduction)"
          fi

  lighthouse:
    # BLOCKING as of Round 8. Every assertion in .lighthouserc.cjs is a
    # "warn", so a low score cannot fail this job - a failure here always
    # means a Lighthouse runtime error, i.e. the production bundle genuinely
    # did not render. This is the only check that exercises the real bundle
    # in a real browser; it is what finally surfaced the TDZ crash that
    # served a blank page while 1017 unit tests stayed green.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: pnpm/action-setup@v4
        with:
          version: 10
          run_install: false
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build
        working-directory: artifacts/access-mi
        run: pnpm build
      - name: Lighthouse CI
        working-directory: artifacts/access-mi
        run: pnpm dlx @lhci/cli@0.14.x autorun
