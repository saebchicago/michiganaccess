name: build-data

# Rebuilds static open-data files and commits them. Netlify serves the result
# as static assets — no database involved. Public repo = free unlimited Actions.

on:
  schedule:
    - cron: "17 6 * * 1"    # weekly, Mondays 06:17 UTC. Adjust cadence as needed.
  workflow_dispatch: {}       # manual "Run workflow" button

permissions:
  contents: write             # REQUIRED to commit rebuilt data back. An explicit
                              # permissions block drops all defaults, so this line
                              # also restores the read access checkout needs.

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Preflight - CENSUS_API_KEY must be present
        # Without this, a missing secret surfaces only as an opaque throw from
        # deep inside the refresh script ("CENSUS_API_KEY is empty and
        # --require-live was passed"), several steps into the log. This job
        # then fails red every Monday while the ACS broadband dataset stays
        # 100% null in production and nobody is told what to do about it.
        # Fail at the top instead, with the exact remediation.
        env:
          CENSUS_API_KEY: ${{ secrets.CENSUS_API_KEY }}
        run: |
          if [ -z "${CENSUS_API_KEY}" ]; then
            echo "::error title=CENSUS_API_KEY is not set as a GitHub Actions secret::A key stored in Netlify or Supabase does NOT reach this workflow. Until it is set here, src/data/acs-broadband-county.generated.json stays at status pending-ci with all 83 counties null."
            echo ""
            echo "This project keeps CENSUS_API_KEY in THREE separate stores. They do not"
            echo "share values, and having it in one says nothing about the others:"
            echo ""
            echo "  1. GitHub Actions secrets  -> this workflow and facility-refresh.yml."
            echo "                                THIS is the one that is missing."
            echo "  2. Supabase function secrets -> the census-acs-proxy, chna-data-proxy,"
            echo "                                medicaid-coverage-at-risk and"
            echo "                                dual-eligible-exposure edge functions."
            echo "  3. Netlify environment variables -> the Netlify build and"
            echo "                                netlify/functions/*. Note that NOTHING"
            echo "                                census-related reads from here: the three"
            echo "                                Netlify functions are airnow, eia and"
            echo "                                epa-echo. A key set only in Netlify is"
            echo "                                inert for Census data."
            echo ""
            echo "To fix (one time, about 30 seconds):"
            echo "  1. Get the key you already have, or request a free one:"
            echo "     https://api.census.gov/data/key_signup.html"
            echo "  2. In THIS repo: Settings > Secrets and variables > Actions"
            echo "     > New repository secret"
            echo "  3. Name it exactly CENSUS_API_KEY and paste the key as the value"
            echo "  4. Re-run this workflow (Actions > build-data > Run workflow)"
            echo ""
            echo "Do not paste the key into source, a PR, or a chat transcript - a"
            echo "repository secret is the only place it belongs."
            exit 1
          fi
          echo "CENSUS_API_KEY is present as a GitHub Actions secret (value redacted)."

      - name: Build open-data files
        run: node scripts/build-data.mjs
        env:
          DATA_SOURCES: data-sources.json
          OUT_DIR: artifacts/access-mi/public/data
          CENSUS_API_KEY: ${{ secrets.CENSUS_API_KEY }}

      - name: Populate ACS broadband county data
        # A single `run:` only. This step previously carried two `run:` keys;
        # YAML keeps the last, so the flag-less variant executed and
        # --require-live was silently dropped, letting the weekly refresh
        # commit fallback data as if it were a fresh pull.
        run: node scripts/refresh-acs-broadband-county.mjs --apply --require-live
        working-directory: artifacts/access-mi
        env:
          CENSUS_API_KEY: ${{ secrets.CENSUS_API_KEY }}

      - name: Populate ACS county SDOH bundle
        # Ten county measures (poverty, child poverty, rent and owner cost
        # burden, no-vehicle households, long commutes, attainment,
        # limited-English households, crowding, tenure) from the ACS 5-Year
        # detail tables. Same key, same --require-live contract as the
        # broadband step: never commit a stub over populated data.
        run: node scripts/refresh-acs-sdoh-county.mjs --apply --require-live
        working-directory: artifacts/access-mi
        env:
          CENSUS_API_KEY: ${{ secrets.CENSUS_API_KEY }}

      - name: Regenerate the provenance index
        # Refreshing acs-broadband-county.generated.json rewrites its
        # provenance.ingested_at, and src/data/dataFreshness.ts derives
        # lastPulled from provenance-index.generated.json. Committing the
        # dataset without the index leaves them disagreeing, which is exactly
        # what check-data-freshness.mjs fails on - and did, on 2026-08-17,
        # turning main red until the index was regenerated by hand.
        run: node scripts/generate-provenance-index.mjs
        working-directory: artifacts/access-mi

      - name: Commit if changed
        run: |
          git config user.name "data-bot"
          git config user.email "actions@users.noreply.github.com"
          git add artifacts/access-mi/public/data artifacts/access-mi/src/data/acs-broadband-county.generated.json artifacts/access-mi/src/data/acs-broadband-county.ts artifacts/access-mi/src/data/acs-sdoh-county.generated.json artifacts/access-mi/src/data/acs-sdoh-county.ts artifacts/access-mi/src/data/provenance-index.generated.json
          if git diff --staged --quiet; then
            echo "No data changes."
          else
            git commit -m "data: scheduled rebuild $(date -u +%Y-%m-%d)"
            git push
          fi
