[build]
  command = "npm run build && node scripts/write-build-manifest.mjs"
  publish = "dist"
  ignore = "node ./scripts/netlify-ignore-build.mjs"

# Netlify config for the Access Michigan site.
#
# The [build] block above pins the build command and the publish dir
# (repo-root dist/, which is what the npm run build script ultimately
# copies to). Deploy Previews and branch deploys remain automatic so every
# PR can be reviewed without publishing it. Production is different: the
# ignore script skips ordinary main-branch commits and automated data refreshes.
# A production build runs only for the explicit release marker created by the
# GitHub "Publish production release" workflow. This batches many reviewed
# changes into one deliberate production deploy and avoids spending a deploy
# on every merge while retaining Git history and Netlify deploy traceability.
# The rest of this file adds baseline HTTP security headers and cache policy.

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "SAMEORIGIN"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(self), interest-cohort=()"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"
    # script-src carries no 'unsafe-inline'. There are no executable
    # inline scripts; the first-party analytics tag is served same-origin
    # through the /_ah/ proxy rules and is covered by 'self'.
    # Everything else the build emits inline is
    # <script type="application/ld+json">, which is data rather than
    # executable code and is not subject to script-src.
    #
    # style-src keeps 'unsafe-inline': the app relies on inline style
    # attributes throughout (Tailwind utility classes plus Framer Motion),
    # so it is not a fixed, hashable set. connect-src and img-src stay
    # broad because the app fetches directly from dozens of federal/state
    # data APIs (CMS, HRSA, CDC, EPA, Census, NWS, etc.) client-side;
    # object-src/base-uri/form-action are locked down since nothing on
    # the site needs them.
    Content-Security-Policy = "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' data:; connect-src 'self' https:; frame-src 'self' https://vizhub.healthdata.org https://www.cdc.gov; frame-ancestors 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; upgrade-insecure-requests"

# The /embed route exists so partners can iframe the widget on their
# own domains. Drop X-Frame-Options and relax frame-ancestors for that
# path only so embedding works; the rest of the site stays SAMEORIGIN.
[[headers]]
  for = "/embed*"
  [headers.values]
    X-Frame-Options = ""
    Content-Security-Policy = "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' data:; connect-src 'self' https:; frame-src 'self' https://vizhub.healthdata.org https://www.cdc.gov; frame-ancestors *; object-src 'none'; base-uri 'self'; form-action 'self'; upgrade-insecure-requests"

[[headers]]
  for = "/data/*"
  [headers.values]
    Cache-Control = "public, max-age=3600, stale-while-revalidate=86400"

# The service worker must never be cached long-term or clients would
# keep running stale app shells after a deploy.
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# Self-hosted brand fonts. The filenames are stable across deploys, so
# they can be cached aggressively at the edge and in the browser. If
# a font is ever replaced, change the filename to bust the cache.
[[headers]]
  for = "/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Renamed routes - declared as <Navigate> inside the SPA. Mirror them
# at the edge so crawlers and direct nav skip the SPA round-trip and
# get the canonical URL via a 301. Order MUST stay above the SPA
# catch-all below; Netlify evaluates redirects top-down.
[[redirects]]
  from = "/health-equity"
  to = "/equity"
  status = 301
[[redirects]]
  from = "/broadband"
  to = "/civic-data"
  status = 301
[[redirects]]
  from = "/chna"
  to = "/chna-explorer"
  status = 301
[[redirects]]
  from = "/map"
  to = "/health-map"
  status = 301
[[redirects]]
  from = "/check-benefits"
  to = "/benefits"
  status = 301
[[redirects]]
  from = "/data-hub"
  to = "/data-and-insights"
  status = 301
[[redirects]]
  from = "/health-data"
  to = "/data"
  status = 301
[[redirects]]
  from = "/representatives"
  to = "/civic-data"
  status = 301
[[redirects]]
  from = "/roots"
  to = "/story"
  status = 301
[[redirects]]
  from = "/county-compare"
  to = "/compare"
  status = 301
[[redirects]]
  from = "/snap"
