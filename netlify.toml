# First-party analytics proxy (Analytics Hub). Same-origin paths so the
# tracker script and its collect calls are covered by script-src 'self' and
# connect-src 'self' with no CSP change. These MUST stay above the SPA
# catch-all below or /_ah/* would be answered with index.html.
# The force flag below stops a future file under dist/_ah/ from shadowing the proxy.
[[redirects]]
  from = "/_ah/t.js"
  to = "https://saeb-analytics-hub.lovable.app/tracker.js"
  status = 200
  force = true
[[redirects]]
  from = "/_ah/c"
  to = "https://saeb-analytics-hub.lovable.app/api/public/collect"
  status = 200
  force = true

# Unknown paths: real 404. This used to be `/* -> /index.html 200`, which
# answered every typo, retired route and deleted page with 200 and the
# homepage head (a soft 404 crawlers read as a duplicate of "/"). Valid SPA
# routes without a prerendered file get their 200 from dist/_redirects,
# generated from the router by scripts/generate-spa-rewrites.mjs; Netlify
# evaluates that file before this one, and this rule stays last so the legacy
# 301s above still apply. /404.html boots the app, so React Router still
# renders NotFound client-side. Guarded by scripts/check-spa-rewrites.mjs.
#
# /brief?county=<slug> is served by netlify/edge-functions/brief-county.js
# (path set in the function's inline config).
[[redirects]]
  from = "/*"
  to = "/404.html"
  status = 404
